services:
  viagem:
    build: .
    image: viagem:latest
    container_name: viagem
    restart: unless-stopped
    env_file:
      # Opcional: em painéis como o Coolify as variáveis vêm da interface,
      # e o .env nem sequer existe no servidor (está no .gitignore).
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_FILE: /data/viagem.db
      # Obrigatório. Sem isto a app não arranca — ver README.
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET no .env ou no ambiente}
      # URL público, usado nos links de partilha dos passeios.
      BASE_URL: ${BASE_URL:-}
      APP_NAME: ${APP_NAME:-Viagem}
      # Emails (recuperação de palavra-passe e avisos). Opcionais: sem eles a
      # app funciona, mas não envia nada — ver README.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Fuso horário do contentor: afecta as horas mostradas no mural.
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      # Base de dados SQLite persistente entre reinícios e actualizações
      - viagem-data:/data
    ports:
      # Só escuta em localhost: o nginx do VPS faz o proxy e trata do HTTPS
      - "127.0.0.1:3000:3000"

volumes:
  viagem-data:
